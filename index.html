<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Daily Bugle Bounty Board</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1120; color: #f8fafc; padding-bottom: 90px; user-select: none; -webkit-user-select: none; }
    
    header { background: #0f172a; border-bottom: 4px solid #dc2626; padding: 12px 16px; position: sticky; top: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; }
    .logo-box { background: #dc2626; color: white; font-weight: 900; font-size: 18px; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid #f87171; }
    .title-red { color: #ef4444; font-weight: 900; font-size: 18px; letter-spacing: 0.5px; }
    .title-blue { color: #3b82f6; font-weight: 900; font-size: 18px; letter-spacing: 0.5px; }
    .badge { font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 12px; background: #1e293b; color: #4ade80; border: 1px solid #334155; }
    
    .btn { cursor: pointer; border: none; outline: none; border-radius: 12px; font-weight: bold; font-size: 13px; padding: 8px 14px; transition: 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn-blue { background: #2563eb; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-dark { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-sm { font-size: 11px; padding: 6px 10px; border-radius: 8px; }

    main { max-width: 680px; margin: 0 auto; padding: 14px 14px 0 14px; }

    .hero-card { background: #0f172a; border: 2px solid #2563eb; border-radius: 16px; padding: 14px; display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
    .hero-img { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; border: 2px solid #ef4444; background: #020617; flex-shrink: 0; }
    .hero-info { flex: 1; }
    .bar-bg { background: #020617; border-radius: 10px; height: 16px; border: 1px solid #334155; overflow: hidden; margin-top: 8px; position: relative; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #2563eb); border-radius: 8px; transition: width 0.3s; width: 0%; }
    
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 10px; text-align: center; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; background: #1e293b; color: #94a3b8; }
    .tab-btn.active { background: #2563eb; color: white; }

    .card { background: #0f172a; border: 2px solid #1e293b; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .card-done { border-color: #1e293b; opacity: 0.65; }
    .card-review { border-color: #3b82f6; background: #0f172a; }
    .tag { font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 6px; }
    .tag-open { background: #1e3a5f; color: #60a5fa; }
    .tag-review { background: #451a03; color: #fbbf24; }
    .tag-done { background: #1e293b; color: #94a3b8; text-decoration: line-through; }
    .price-text { font-size: 18px; font-weight: 900; color: #60a5fa; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #0f172a; border: 2px solid #2563eb; border-radius: 18px; width: 100%; max-width: 440px; padding: 18px; max-height: 90vh; overflow-y: auto; }
    .input-field { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 10px; color: white; padding: 10px; font-size: 14px; margin-bottom: 12px; outline: none; }
    .input-field:focus { border-color: #2563eb; }

    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .key-btn { background: #1e293b; color: white; font-size: 18px; font-weight: bold; border-radius: 10px; padding: 14px; text-align: center; border: none; cursor: pointer; }
    .key-btn:active { background: #334155; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="logo-box">DB</div>
      <div>
        <div><span class="title-red">DAILY BUGLE</span> <span class="title-blue">BOUNTY BOARD</span></div>
        <div style="margin-top:2px;"><span class="badge">● Ready v6.0</span></div>
      </div>
    </div>
    <button id="lockBtn" class="btn btn-dark" type="button">🔒 Parent Unlock</button>
  </header>

  <main>
    <div class="hero-card">
      <img id="hudImg" class="hero-img" src="https://images.brickset.com/sets/images/76178-1.jpg" alt="Goal" />
      <div class="hero-info">
        <div style="font-size:11px; font-weight:bold; color:#f87171; text-transform:uppercase;">Goal Target</div>
        <div id="hudTitle" style="font-size:18px; font-weight:900; line-height:1.2;">LEGO Daily Bugle</div>
        <div class="bar-bg"><div id="hudBar" class="bar-fill"></div></div>
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold; margin-top:5px; color:#94a3b8;">
          <span id="hudRatio">$0 / $100</span>
          <span id="hudPercent" style="color:#60a5fa;">0%</span>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div id="tabBounties" class="tab-btn active">📋 Chores</div>
      <div id="tabWishlist" class="tab-btn">⭐ Top 10 Wishlist</div>
      <div id="tabLoot" class="tab-btn">📦 Loot Vault</div>
    </div>

    <div id="viewBounties">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:15px; font-weight:bold;">Mission Bounties</span>
        <button id="newChoreBtn" class="btn btn-blue btn-sm" type="button" style="display:none;">＋ Post Bounty</button>
      </div>
      <div id="choreList"></div>
    </div>

    <div id="viewWishlist" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:15px; font-weight:bold;">Top 10 Rewards</span>
        <button id="addWishBtn" class="btn btn-blue btn-sm" type="button">＋ Add Goal</button>
      </div>
      <div id="wishlistContainer"></div>
    </div>

    <div id="viewLoot" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:15px; font-weight:bold;">Purchased Loot</span>
        <button id="addLootBtn" class="btn btn-blue btn-sm" type="button">＋ Log Purchase</button>
      </div>
      <div id="lootContainer"></div>
    </div>
  </main>

  <div id="pinModal" class="modal-overlay">
    <div class="modal-box" style="max-width:300px; text-align:center;">
      <div style="font-size:24px; margin-bottom:6px;">🛡️</div>
      <div style="font-size:16px; font-weight:bold; margin-bottom:4px;">Parent Mode</div>
      <div style="font-size:11px; color:#94a3b8; margin-bottom:12px;">Enter PIN (Default: 1234)</div>
      <input id="pinDisplay" type="password" maxlength="4" readonly style="width:120px; text-align:center; font-size:24px; font-weight:900; background:#020617; border:2px solid #334155; border-radius:10px; color:white; padding:6px; margin:0 auto 14px auto; display:block;" />
      
      <div class="keypad-grid">
        <button class="key-btn" type="button" onclick="kPress('1')">1</button>
        <button class="key-btn" type="button" onclick="kPress('2')">2</button>
        <button class="key-btn" type="button" onclick="kPress('3')">3</button>
        <button class="key-btn" type="button" onclick="kPress('4')">4</button>
        <button class="key-btn" type="button" onclick="kPress('5')">5</button>
        <button class="key-btn" type="button" onclick="kPress('6')">6</button>
        <button class="key-btn" type="button" onclick="kPress('7')">7</button>
        <button class="key-btn" type="button" onclick="kPress('8')">8</button>
        <button class="key-btn" type="button" onclick="kPress('9')">9</button>
        <button class="key-btn" type="button" onclick="kClear()" style="color:#ef4444; font-size:13px;">Clear</button>
        <button class="key-btn" type="button" onclick="kPress('0')">0</button>
        <button class="key-btn" type="button" onclick="kSubmit()" style="background:#2563eb; color:white; font-size:13px;">OK</button>
      </div>
      <button type="button" onclick="closePin()" style="background:none; border:none; color:#94a3b8; font-size:12px; text-decoration:underline; cursor:pointer;">Cancel</button>
    </div>
  </div>

  <div id="missionModal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
        <div>
          <span id="mLoc" style="font-size:10px; font-weight:bold; background:#1e3a5f; color:#60a5fa; padding:2px 6px; border-radius:6px;"></span>
          <div id="mTitle" style="font-size:18px; font-weight:900; margin-top:4px;"></div>
        </div>
        <div id="mReward" style="font-size:20px; font-weight:900; color:#60a5fa;"></div>
      </div>

      <div style="background:#020617; border:1px solid #1e293b; border-radius:12px; padding:10px; margin-bottom:12px;">
        <div style="font-size:11px; font-weight:bold; color:#94a3b8; margin-bottom:6px;">🧰 TOOLS & SUPPLIES</div>
        <div id="mTools" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      </div>

      <div style="margin-bottom:12px;">
        <div style="font-size:11px; font-weight:bold; color:#94a3b8; margin-bottom:6px;">📋 STEPS</div>
        <div id="mSteps" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>

      <div style="background:rgba(220,38,38,0.15); border:1px solid rgba(220,38,38,0.4); border-radius:10px; padding:8px 10px; font-size:11px; color:#fca5a5; margin-bottom:14px;">
        ⚠️ <span id="mSafety"></span>
      </div>

      <div style="display:flex; gap:8px;">
        <button type="button" onclick="closeMission()" class="btn btn-red" style="flex:1;">Back</button>
        <button id="finishMissionBtn" type="button" onclick="confirmMissionFinish()" class="btn btn-blue" style="flex:2;">I Finished This!</button>
      </div>
    </div>
  </div>

  <div id="choreModal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-size:16px; font-weight:bold; margin-bottom:10px;">Post New Bounty</div>
      <div style="display:flex; gap:6px; margin-bottom:10px;">
        <input id="inputChoreTitle" class="input-field" style="margin-bottom:0;" placeholder="e.g. Millie dog wash" />
        <button id="btnAiPlan" type="button" onclick="runAiPlan()" class="btn btn-blue" style="white-space:nowrap; font-size:12px;">✨ AI Plan</button>
      </div>

      <div style="display:flex; gap:8px;">
        <input id="inputChoreReward" type="number" class="input-field" placeholder="Reward $" />
        <input id="inputChoreLoc" class="input-field" placeholder="Location" />
      </div>

      <input id="inputChoreTools" class="input-field" placeholder="Tools (comma separated)" />
      <textarea id="inputChoreSteps" class="input-field" rows="3" placeholder="Steps (one per line)"></textarea>
      <input id="inputChoreSafety" class="input-field" placeholder="Safety warning" />

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" onclick="closeChoreModal()" class="btn btn-red">Cancel</button>
        <button type="button" onclick="saveNewChore()" class="btn btn-blue">Save Bounty</button>
      </div>
    </div>
  </div>

  <div id="wishModal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-size:16px; font-weight:bold; margin-bottom:10px;">Add Dream Goal</div>
      <div style="display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;">
        <button type="button" onclick="pickPreset('Daily Bugle', 100, 'https://images.brickset.com/sets/images/76178-1.jpg')" class="btn btn-dark btn-sm">Daily Bugle ($100)</button>
        <button type="button" onclick="pickPreset('Final Battle', 105, 'https://images.brickset.com/sets/images/76261-1.jpg')" class="btn btn-dark btn-sm">Final Battle ($105)</button>
        <button type="button" onclick="pickPreset('Sanctum', 250, 'https://images.brickset.com/sets/images/76218-1.jpg')" class="btn btn-dark btn-sm">Sanctum ($250)</button>
      </div>

      <input id="inputWishTitle" class="input-field" placeholder="Item Name" />
      <input id="inputWishPrice" type="number" class="input-field" placeholder="Cost ($)" />
      <input id="inputWishImg" class="input-field" placeholder="Image URL" />

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" onclick="closeWishModal()" class="btn btn-red">Cancel</button>
        <button type="button" onclick="saveNewWish()" class="btn btn-blue">Save Goal</button>
      </div>
    </div>
  </div>

  <div id="lootModal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-size:16px; font-weight:bold; margin-bottom:10px;">Log Purchase</div>
      <input id="inputLootTitle" class="input-field" placeholder="Item bought" />
      <input id="inputLootPrice" type="number" class="input-field" placeholder="Price ($)" />
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" onclick="closeLootModal()" class="btn btn-red">Cancel</button>
        <button type="button" onclick="saveNewLoot()" class="btn btn-blue">Deduct Cash</button>
      </div>
    </div>
  </div>

  <script>
    var DATA = {
      targetId: "w1",
      bounties: [
        { id: "b1", title: "Wash out Sandpit", reward: 5, status: "completed", location: "Backyard", tools: ["Hose", "Rake", "Bin"], steps: ["Rake leaves", "Hose rim clean", "Pack toys"], safety: "Turn off tap tightly." },
        { id: "b2", title: "Fix the Tap Washer", reward: 5, status: "completed", location: "Outside Tap", tools: ["Wrench", "Washer", "Rag"], steps: ["Turn off main valve", "Swap rubber washer", "Tighten securely"], safety: "Never force brass threads." },
        { id: "b3", title: "BBQ Clean", reward: 5, status: "completed", location: "Patio Grill", tools: ["Grill brush", "Warm sponge", "Towels"], steps: ["Ensure grill cold", "Scrape grates", "Wipe grease tray"], safety: "Gas must be OFF." },
        { id: "b4", title: "Plant the Big Tree", reward: 10, status: "open", location: "Backyard", tools: ["Shovel", "Hose", "Mulch"], steps: ["Dig hole wide", "Stand tree straight", "Pack soil & water"], safety: "Lift shovel with your knees!" },
        { id: "b5", title: "Clean Up Side Near BBQ", reward: 10, status: "completed", location: "Side Yard", tools: ["Broom", "Dustpan", "Bag"], steps: ["Clear loose items", "Sweep path", "Bag leaves"], safety: "Check corners for spiders." },
        { id: "b6", title: "Gutters Project Assistant", reward: 100, status: "open", location: "Roof Edge / Yard", tools: ["Bucket", "Gloves", "Hose"], steps: ["Hold perimeter", "Catch debris bucket", "Hose drain guard"], safety: "Never climb ladder without adult." },
        { id: "b7", title: "Secret Room Cleanup", reward: 30, status: "open", location: "Secret Room", tools: ["Storage bins", "Rag", "Vacuum"], steps: ["Sort loose LEGO", "Clear floor", "Vacuum corners"], safety: "Pick up small pieces before vacuuming." }
      ],
      wishlist: [
        { id: "w1", title: "LEGO Daily Bugle (76178)", price: 100, image: "https://images.brickset.com/sets/images/76178-1.jpg" },
        { id: "w2", title: "Spider-Man Final Battle", price: 105, image: "https://images.brickset.com/sets/images/76261-1.jpg" },
        { id: "w3", title: "Venom & Sandman Extension", price: 20, image: "https://images.brickset.com/sets/images/76280-1.jpg" }
      ],
      loot: [
        { id: "l1", title: "Venom & Sandman Set", price: 20, date: "2026-10-20" },
        { id: "l2", title: "Spider-Man Minifigures Pack", price: 42, date: "2026-10-24" }
      ]
    };

    var stored = localStorage.getItem('gill_bounty_v6');
    if (stored) {
      try { DATA = JSON.parse(stored); } catch(e){}
    }

    var isParent = false;
    var pinVal = "";
    var activeMissionId = null;

    function save() {
      try { localStorage.setItem('gill_bounty_v6', JSON.stringify(DATA)); } catch(e){}
      render();
    }

    function render() {
      var earned = 0;
      for (var i = 0; i < DATA.bounties.length; i++) {
        if (DATA.bounties[i].status === 'completed') earned += DATA.bounties[i].reward;
      }
      var spent = 0;
      for (var j = 0; j < DATA.loot.length; j++) {
        spent += DATA.loot[j].price;
      }
      var bal = Math.max(0, earned - spent);

      var target = DATA.wishlist[0];
      for (var k = 0; k < DATA.wishlist.length; k++) {
        if (DATA.wishlist[k].id === DATA.targetId) target = DATA.wishlist[k];
      }

      var goalCost = target ? target.price : 100;
      var pct = Math.min(100, Math.round((bal / goalCost) * 100));

      document.getElementById('hudTitle').textContent = target ? target.title : "LEGO Goal";
      if (target && target.image) document.getElementById('hudImg').src = target.image;
      document.getElementById('hudBar').style.width = pct + "%";
      document.getElementById('hudRatio').textContent = "$" + bal + " / $" + goalCost;
      document.getElementById('hudPercent').textContent = pct + "%";

      var container = document.getElementById('choreList');
      container.innerHTML = "";
      for (var c = 0; c < DATA.bounties.length; c++) {
        (function(b) {
          var isDone = b.status === 'completed';
          var isRev = b.status === 'review';
          
          var card = document.createElement('div');
          card.className = isDone ? "card card-done" : (isRev ? "card card-review" : "card");

          var topRow = document.createElement('div');
          topRow.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;";
          
          var tag = document.createElement('span');
          tag.className = isDone ? "tag tag-done" : (isRev ? "tag tag-review" : "tag tag-open");
          tag.textContent = isDone ? "✓ COMPLETED" : (isRev ? "⏳ UNDER REVIEW" : "★ OPEN");
          
          var price = document.createElement('span');
          price.className = "price-text";
          price.textContent = "+$" + b.reward;
          topRow.appendChild(tag);
          topRow.appendChild(price);

          var title = document.createElement('div');
          title.style.cssText = "font-size:15px; font-weight:bold;" + (isDone ? "text-decoration:line-through; color:#94a3b8;" : "");
          title.textContent = b.title;

          var loc = document.createElement('div');
          loc.style.cssText = "font-size:11px; color:#94a3b8; margin:4px 0 8px 0;";
          loc.textContent = "📍 " + (b.location || "Home");

          var btnRow = document.createElement('div');
          btnRow.style.cssText = "display:flex; gap:6px; margin-top:8px;";

          var viewBtn = document.createElement('button');
          viewBtn.className = "btn btn-dark btn-sm";
          viewBtn.style.flex = "1";
          viewBtn.type = "button";
          viewBtn.textContent = "Mission Steps";
          viewBtn.onclick = function() { openMission(b.id); };
          btnRow.appendChild(viewBtn);

          if (!isDone && !isRev) {
            var doneBtn = document.createElement('button');
            doneBtn.className = "btn btn-blue btn-sm";
            doneBtn.style.flex = "1";
            doneBtn.type = "button";
            doneBtn.textContent = "Finished!";
            doneBtn.onclick = function() { markDone(b.id); }
